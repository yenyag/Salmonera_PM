<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Salmonero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      font-family: 'Inter', sans-serif;
    }
    .input-bubble {
      border-radius: 50px;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="bg-blue-600 py-6 px-8 text-center">
      <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-fish text-blue-600 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Gestión Salmonera</h1>
      <p class="text-blue-100 mt-1">Inicia sesión en tu cuenta</p>
    </div>

    <!-- Formulario -->
    <form id="loginForm" class="p-8 space-y-6">
      <div>
        <label class="block text-gray-700 mb-2 text-sm font-medium">Correo electrónico</label>
        <div class="input-bubble flex items-center border border-gray-200 px-4 py-3 rounded-full focus-within:ring-2 focus-within:ring-blue-500">
          <i class="fas fa-envelope text-gray-400 mr-3"></i>
          <input 
            type="email" 
            id="email" 
            class="w-full bg-transparent outline-none placeholder-gray-400 text-gray-700"
            placeholder="usuario@salmonera.com"
            required
          >
        </div>
      </div>

      <div>
        <label class="block text-gray-700 mb-2 text-sm font-medium">Contraseña</label>
        <div class="input-bubble flex items-center border border-gray-200 px-4 py-3 rounded-full focus-within:ring-2 focus-within:ring-blue-500">
          <i class="fas fa-lock text-gray-400 mr-3"></i>
          <input 
            type="password" 
            id="password" 
            class="w-full bg-transparent outline-none placeholder-gray-400 text-gray-700"
            placeholder="••••••••"
            required
          >
          <button type="button" id="togglePassword" class="text-gray-400 hover:text-blue-600 ml-2">
            <i class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-full transition duration-300 shadow-md hover:shadow-lg"
      >
        Ingresar
      </button>
    </form>

    <!-- Footer -->
    <div class="bg-gray-50 px-8 py-4 text-center border-t border-gray-100">
      <p class="text-sm text-gray-600">¿Problemas para acceder? <a href="#" class="text-blue-600 hover:underline">Contactar soporte</a></p>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
