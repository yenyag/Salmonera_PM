<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Sistema Salmonero</title>
  <link href="./css/output.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      font-family: 'Inter', sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .bubble {
      border-radius: 50px;
      transition: all 0.3s ease;
    }
    .input-bubble {
      border-radius: 50px;
      padding: 15px 25px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    .btn-bubble {
      border-radius: 50px;
      padding: 15px 0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="text-center w-full max-w-md">
    <!-- Logo -->
    <div class="mx-auto mb-8 w-24 h-24 rounded-full bg-white flex items-center justify-center shadow-lg bubble">
      <i class="fas fa-fish text-blue-500 text-3xl"></i>
    </div>
    
    <!-- Título -->
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Bienvenido</h1>
    <p class="text-gray-600 mb-8">Inicia sesión en tu cuenta</p>
    
    <!-- Formulario -->
    <form id="loginForm" class="space-y-4">
      <!-- Email -->
      <div class="input-bubble">
        <div class="flex items-center">
          <i class="fas fa-envelope text-gray-400 ml-2 mr-3"></i>
          <input 
            type="email" 
            id="email" 
            class="w-full bg-transparent outline-none placeholder-gray-400"
            placeholder="Correo electrónico"
            required
          >
        </div>
      </div>
      
      <!-- Contraseña -->
      <div class="input-bubble">
        <div class="flex items-center">
          <i class="fas fa-lock text-gray-400 ml-2 mr-3"></i>
          <input 
            type="password" 
            id="password" 
            class="w-full bg-transparent outline-none placeholder-gray-400"
            placeholder="Contraseña"
            required
          >
          <button 
            type="button" 
            id="togglePassword" 
            class="text-gray-400 hover:text-blue-500 mr-2"
          >
            <i class="far fa-eye"></i>
          </button>
        </div>
      </div>
      
      <!-- Botón -->
      <button 
        type="submit" 
        class="w-full bg-blue-500 text-white btn-bubble hover:bg-blue-600 shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
      >
        Ingresar
      </button>
      
      <!-- Opciones -->
      <div class="flex justify-center space-x-4 pt-2">
        <a href="#" class="text-sm text-blue-500 hover:text-blue-700 bubble px-4 py-2 bg-blue-50">
          <i class="fas fa-key mr-1"></i> Recuperar acceso
        </a>
        <a href="#" class="text-sm text-gray-500 hover:text-gray-700 bubble px-4 py-2 bg-gray-50">
          <i class="fas fa-question-circle mr-1"></i> Ayuda
        </a>
      </div>
    </form>
    
    <!-- Footer -->
    <div class="mt-12 text-sm text-gray-400">
      <p>© 2023 Sistema Salmonero | v3.0</p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'
    import './js/auth.js'
    
    // Toggle para contraseña
    document.getElementById('togglePassword').addEventListener('click', () => {
      const passwordInput = document.getElementById('password');
      const icon = document.querySelector('#togglePassword i');
      
      if (passwordInput.getAttribute('type') === 'password') {
        passwordInput.setAttribute('type', 'text');
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.setAttribute('type', 'password');
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>
</body>
</html>
