<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistema Salmonero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chart-container {
      height: 300px;
      width: 100%;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Barra Superior -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fas fa-fish text-blue-600 text-2xl"></i>
        <h1 class="text-xl font-bold text-gray-800">Panel de Control</h1>
      </div>
      <button id="logoutBtn" class="flex items-center space-x-2 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">
        <i class="fas fa-sign-out-alt"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-gray-800">Bienvenido, <span id="username" class="text-blue-600">Administrador</span></h2>
      <p class="text-gray-600">Resumen de operaciones y métricas clave</p>
    </div>

    <!-- Gráficos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <!-- Gráfico 1 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold mb-4">Ventas Mensuales (CLP)</h3>
        <div class="chart-container">
          <canvas id="ventasChart"></canvas>
        </div>
      </div>

      <!-- Gráfico 2 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold mb-4">Distribución por Calidad</h3>
        <div class="chart-container">
          <canvas id="calidadChart"></canvas>
        </div>
      </div>

      <!-- Gráfico 3 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold mb-4">Mortalidad Acumulada</h3>
        <div class="chart-container">
          <canvas id="mortalidadChart"></canvas>
        </div>
      </div>

      <!-- Gráfico 4 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-semibold mb-4">Rentabilidad por Centro</h3>
        <div class="chart-container">
          <canvas id="rentabilidadChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="./js/supabase.js"></script>
  <script type="module" src="./js/charts.js"></script>
  <script type="module">
    import { supabase } from './js/supabase.js';

    // Cargar nombre de usuario
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';
    document.getElementById('username').textContent = user.nombre;

    // Cerrar sesión
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
